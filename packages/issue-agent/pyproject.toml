[project]
name = "issue-agent"
version = "0.1.0"
description = "VOID Issue Agent - converts evaluated AI incidents into engineering-ready GitHub Issues"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.2",
    "httpx>=0.27.0",
]

[project.scripts]
issue-agent = "issue_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]