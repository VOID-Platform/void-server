[project]
name = "evaluator"
version = "0.1.0"
description = "VOID Evaluator - AI incident evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
evaluator = "evaluator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
